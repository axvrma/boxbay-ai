services:
  api:
    build: .
    environment:
      BOXBAY_OPERATOR_TOKEN: local-boxbay-operator
      BOXBAY_ADMIN_TOKEN: local-boxbay-admin
      BOXBAY_STATE_DIR: /var/lib/boxbay
    ports:
      - "127.0.0.1:8000:8000"
    user: "boxbay"
    volumes:
      - boxbay:/var/lib/boxbay
  web:
    image: node:22.22.0-alpine
    working_dir: /app
    volumes:
      - ./apps/web:/app
      - web_modules:/app/node_modules
    environment:
      BOXBAY_API_PROXY: http://api:8000
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
volumes:
  boxbay:
  web_modules:
